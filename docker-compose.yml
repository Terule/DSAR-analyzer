services:
  app:
    image: aida:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      STAGING_PATH: /data/Staging
      EXTRACTED_PATH: /data/Results
      # The app must use the same durable AI submission path as the dispatcher.
      # Otherwise it can start a legacy direct Batch while the dispatcher also
      # recovers and submits the same AI coordinator.
      CONTROL_PLANE_PIPELINE_ENABLED: "true"
      POSTGRES_URL: postgres://pst:pst@postgres:5432/pst_analyser
      REDIS_URL: redis://redis:6379
    command:
      [
        "sh",
        "-lc",
        "npx prisma migrate deploy && node scripts/docker-check.mjs && npm run dev -- --hostname 0.0.0.0 --port 3000",
      ]
    ports:
      - "3000:3000"
    volumes:
      - /Users/rgomes/DSAR:/data
      - aida_secrets:/run/aida-secrets
      - ./logs:/workspace/logs
      - ./batches:/workspace/batches
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  dispatcher:
    image: aida:local
    init: true
    environment:
      STAGING_PATH: /data/Staging
      EXTRACTED_PATH: /data/Results
      CONTROL_PLANE_PIPELINE_ENABLED: "true"
      POSTGRES_URL: postgres://pst:pst@postgres:5432/pst_analyser
      REDIS_URL: redis://redis:6379
      WORKER_IMAGE: aida:local
      # Normal Files work stays parallel. Large Office files are scheduled in a
      # deferred, one-worker lane with a larger container memory limit.
      FILES_CONCURRENCY: "2"
      LARGE_FILES_JOB_MEMORY_MB: "3072"
      OFFICE_WORKER_HEAP_MB: "2048"
      # Compose's stable project-default network. Override only when the stack
      # is intentionally started with a different project/network name.
      WORKER_NETWORK: pst-analyser_default
    command: ["node", "--import", "tsx", "scripts/orchestrator/dispatcher.ts"]
    volumes:
      - /Users/rgomes/DSAR:/data
      - aida_secrets:/run/aida-secrets
      - ./logs:/workspace/logs
      - ./batches:/workspace/batches
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pst_analyser
      POSTGRES_USER: pst
      POSTGRES_PASSWORD: pst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pst -d pst_analyser"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  aida_secrets:
